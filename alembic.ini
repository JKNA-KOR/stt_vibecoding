# Alembic 설정 (Harness §12: Schema 변경은 반드시 Migration 을 통한다).
#
# 접속 URL 은 여기 두지 않는다. 운영 자격증명이 저장소에 들어가는 것을 막고(Harness §9),
# 환경별 값을 코드 밖에서 관리하기 위해(§5.2) migrations/env.py 가 `DATABASE_URL`
# 환경변수를 읽는다.

[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os
version_path_separator = os
# 파일명이 시간순으로 정렬되도록 리비전 앞에 타임스탬프를 붙인다.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
# Harness §35: SQL Debug Logging 을 켜지 않는다.
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

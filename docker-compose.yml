# STT 서비스 로컬/개발 스택 (Harness §34 / §38 / §56).
#
# 운영 배포용이 아니다. 운영에서는 DB·Redis 를 관리형 또는 별도 호스트에 두고, 이
# 파일의 애플리케이션 정의만 참고한다. 값은 전부 .env 에서 온다 (§5.2).
#
#   cp .env.example .env      # 값을 채운다 (SESSION_SECRET, DB 비밀번호)
#   docker compose up -d db redis
#   docker compose run --rm migrate
#   docker compose up -d api worker
#
# 메모리 산정은 docs/OPERATIONS.md 를 참고한다. 이 머신에서 medium 모델과 전체 스택을
# 동시에 띄우면 스왑이 발생한다.

name: stt-service

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-local}
  APP_VERSION: ${APP_VERSION:-1.0.0}
  GIT_COMMIT: ${GIT_COMMIT:-unknown}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DEBUG: ${DEBUG:-false}

  SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET 이 필요하다 (Harness §9)}
  SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
  BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}

  # 초기 관리자 생성 스크립트가 컨테이너 안에서 읽는 값이다. 계정을 만든 뒤에는
  # .env 에서 비우고 서비스를 재시작한다 — prod 에 남아 있으면 기동이 거부된다
  # (Harness §9 / §61-5). 기본값이 빈 문자열이므로 지정하지 않으면 스크립트가
  # 아무것도 만들지 않고 종료한다.
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

  # 런타임 계정은 DDL 권한이 없다 (SEC-026).
  DATABASE_URL: postgresql+psycopg://${STT_APP_DB_USER:-stt_app}:${STT_APP_DB_PASSWORD:?필요}@db:5432/${POSTGRES_DB:-stt}
  MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-stt_owner}:${POSTGRES_PASSWORD:?필요}@db:5432/${POSTGRES_DB:-stt}
  REDIS_URL: redis://redis:6379/0
  QUEUE_BACKEND: ${QUEUE_BACKEND:-celery}

  STT_ENGINE: ${STT_ENGINE:-faster-whisper}
  STT_MODEL_NAME: ${STT_MODEL_NAME:-medium}
  STT_MODEL_PATH: ${STT_MODEL_PATH:-}
  STT_DEVICE: ${STT_DEVICE:-cpu}
  STT_COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
  STT_LANGUAGE: ${STT_LANGUAGE:-ko}
  STT_CPU_THREADS: ${STT_CPU_THREADS:-4}
  STT_ALLOW_MODEL_DOWNLOAD: ${STT_ALLOW_MODEL_DOWNLOAD:-false}
  # 무음 구간 환각을 걸러 낸다. 0 이면 끄기. 발화를 지우는 동작이라 기본은 꺼짐이다.
  STT_MIN_SEGMENT_CONFIDENCE: ${STT_MIN_SEGMENT_CONFIDENCE:-0}
  STT_MAX_CONCURRENT_JOBS: ${STT_MAX_CONCURRENT_JOBS:-2}
  STT_MAX_UPLOAD_MB: ${STT_MAX_UPLOAD_MB:-500}
  STT_MAX_AUDIO_MINUTES: ${STT_MAX_AUDIO_MINUTES:-180}

  # 외부 전사 API (STT_ENGINE=groq-whisper). 음성 원본이 사내를 벗어나므로
  # ALLOW_EXTERNAL_STT 승인이 없으면 기동이 거부된다 (SEC-021).
  STT_API_BASE_URL: ${STT_API_BASE_URL:-https://api.groq.com/openai/v1}
  STT_API_KEY: ${STT_API_KEY:-}
  STT_API_TIMEOUT_SECONDS: ${STT_API_TIMEOUT_SECONDS:-600}
  STT_API_MAX_UPLOAD_MB: ${STT_API_MAX_UPLOAD_MB:-25}
  ALLOW_EXTERNAL_STT: ${ALLOW_EXTERNAL_STT:-false}

  # 연동 인터페이스 (docs/INTERFACE.md)
  RECORDING_SOURCE: ${RECORDING_SOURCE:-off}
  RECORDING_INGEST_USERNAME: ${RECORDING_INGEST_USERNAME:-}
  RECORDING_BATCH_LIMIT: ${RECORDING_BATCH_LIMIT:-20}
  RECORDING_INBOX_DIR: ${RECORDING_INBOX_DIR:-/data/recordings/inbox}
  RECORDING_PROCESSED_DIR: ${RECORDING_PROCESSED_DIR:-/data/recordings/processed}
  RECORDING_FAILED_DIR: ${RECORDING_FAILED_DIR:-/data/recordings/failed}
  RECORDING_API_BASE_URL: ${RECORDING_API_BASE_URL:-}
  RECORDING_API_KEY: ${RECORDING_API_KEY:-}
  RECORDING_FIELD_ID: ${RECORDING_FIELD_ID:-id}
  RECORDING_FIELD_FILENAME: ${RECORDING_FIELD_FILENAME:-filename}
  RECORDING_FIELD_DOWNLOAD_URL: ${RECORDING_FIELD_DOWNLOAD_URL:-download_url}
  RECORDING_FIELD_RECORDED_AT: ${RECORDING_FIELD_RECORDED_AT:-recorded_at}
  RECORDING_LIST_ITEMS_KEY: ${RECORDING_LIST_ITEMS_KEY:-items}

  OUTBOUND_ENABLED: ${OUTBOUND_ENABLED:-false}
  OUTBOUND_URL: ${OUTBOUND_URL:-}
  OUTBOUND_API_KEY: ${OUTBOUND_API_KEY:-}
  OUTBOUND_MAX_ATTEMPTS: ${OUTBOUND_MAX_ATTEMPTS:-3}
  OUTBOUND_INCLUDE_TRANSCRIPT: ${OUTBOUND_INCLUDE_TRANSCRIPT:-true}
  OUTBOUND_INCLUDE_ANALYSIS: ${OUTBOUND_INCLUDE_ANALYSIS:-true}
  OUTBOUND_INCLUDE_QA: ${OUTBOUND_INCLUDE_QA:-true}
  ALLOW_EXTERNAL_OUTBOUND: ${ALLOW_EXTERNAL_OUTBOUND:-false}

  # LLM 분석 (Harness §8.2 / §54). 기본값은 꺼짐이다.
  # 녹취 본문이 사내 경계를 벗어나지 않도록 로컬 LLM 을 전제로 한다.
  ENABLE_LLM_ANALYSIS: ${ENABLE_LLM_ANALYSIS:-false}
  # 상담 품질 평가(QA). 분석과 같은 Provider 를 쓰며, 켜면 상담당 LLM 호출이 2회가 된다.
  ENABLE_QA: ${ENABLE_QA:-false}

  # Transcript 후처리. 원본을 덮어쓰지 않고 LLM_CORRECTED 를 한 벌 더 만든다.
  # 화자분리는 음향 기반이 아니라 문맥 추정이다 (docs/OPERATIONS.md 4.9).
  ENABLE_LLM_CORRECTION: ${ENABLE_LLM_CORRECTION:-false}
  ENABLE_DIARIZATION: ${ENABLE_DIARIZATION:-false}
  QA_AUTO_RUN: ${QA_AUTO_RUN:-false}

  # 실시간(준실시간) 전사. 켜면 이 출처에 브라우저 마이크 권한이 열린다 (Harness §11).
  ENABLE_REALTIME_STT: ${ENABLE_REALTIME_STT:-false}
  REALTIME_SEGMENT_SECONDS: ${REALTIME_SEGMENT_SECONDS:-6}
  REALTIME_MAX_SESSION_SECONDS: ${REALTIME_MAX_SESSION_SECONDS:-1800}
  REALTIME_MAX_SESSIONS: ${REALTIME_MAX_SESSIONS:-4}
  LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
  LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434}
  LLM_MODEL_NAME: ${LLM_MODEL_NAME:-gemma3:latest}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_JSON_MODE: ${LLM_JSON_MODE:-json_schema}
  LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-300}
  LLM_MAX_TRANSCRIPT_CHARS: ${LLM_MAX_TRANSCRIPT_CHARS:-20000}
  # 추론 모델(OpenRouter 경유 GLM 등) 전용. 추론 토큰이 출력 한도를 함께 소비한다.
  LLM_MAX_OUTPUT_TOKENS: ${LLM_MAX_OUTPUT_TOKENS:-32768}
  LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-}
  LLM_APP_NAME: ${LLM_APP_NAME:-}
  LLM_SITE_URL: ${LLM_SITE_URL:-}
  ALLOW_EXTERNAL_LLM: ${ALLOW_EXTERNAL_LLM:-false}

  # JSON 연동 (외부 시스템 통합). 기본값은 업로드 꺼짐 / 내보내기 켜짐이다.
  ENABLE_JSON_UPLOAD: ${ENABLE_JSON_UPLOAD:-false}
  JSON_UPLOAD_MAX_MB: ${JSON_UPLOAD_MAX_MB:-50}
  JSON_BODY_MAX_KB: ${JSON_BODY_MAX_KB:-512}
  ENABLE_JSON_EXPORT: ${ENABLE_JSON_EXPORT:-true}
  JSON_EXPORT_INCLUDE_TRANSCRIPT: ${JSON_EXPORT_INCLUDE_TRANSCRIPT:-true}
  JSON_EXPORT_INCLUDE_SEGMENTS: ${JSON_EXPORT_INCLUDE_SEGMENTS:-true}
  JSON_EXPORT_INCLUDE_ANALYSIS: ${JSON_EXPORT_INCLUDE_ANALYSIS:-true}

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stt_owner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?필요}
      POSTGRES_DB: ${POSTGRES_DB:-stt}
      STT_APP_DB_USER: ${STT_APP_DB_USER:-stt_app}
      STT_APP_DB_PASSWORD: ${STT_APP_DB_PASSWORD:?필요}
    volumes:
      # PostgreSQL 18 이미지는 데이터를 메이저 버전별 하위 디렉터리에 두며
      # /var/lib/postgresql/data 직접 마운트를 거부한다. 상위 경로를 마운트한다.
      - pgdata:/var/lib/postgresql
      # 첫 기동에만 실행된다. 런타임 계정을 만든다 (테이블 권한은 마이그레이션 후).
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./scripts/grant_least_privilege.sql:/opt/grant_least_privilege.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stt_owner} -d ${POSTGRES_DB:-stt}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 개발 편의를 위한 노출. 운영에서는 포트를 열지 않는다.
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    # 영속화를 끈다. 큐 메시지가 유실되어도 Job 상태는 DB 가 단일 진실이며,
    # 유실된 작업은 관리 화면에서 재시도할 수 있다 (Harness §25).
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # 일회성 마이그레이션. 스키마 소유자 계정으로 실행된다.
  migrate:
    build: .
    environment:
      <<: *app-env
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build: .
    environment:
      <<: *app-env
    volumes:
      - sttdata:/data
      # 모델은 이미지에 굽지 않고 마운트한다 (Harness §42). 읽기 전용이다.
      - ${STT_MODEL_DIR:-./models}:/models:ro
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # /live 를 쓴다. /ready 는 의존 대상 상태를 반영하므로 컨테이너 생존 판단에
      # 쓰면 DB 가 잠깐 흔들릴 때 멀쩡한 프로세스가 재시작된다 (Harness §56).
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/live')"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  worker:
    build: .
    environment:
      <<: *app-env
    # 호스트에서 도는 LLM(Ollama)에 닿기 위한 매핑. LLM 을 별도 컨테이너나 다른
    # 호스트에 두면 LLM_BASE_URL 만 바꾸면 되고 이 줄은 필요 없다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - sttdata:/data
      - ${STT_MODEL_DIR:-./models}:/models:ro
    command:
      - celery
      - -A
      - app.jobs.celery_worker
      - worker
      - --queues=stt
      - --loglevel=INFO
      # 동시 실행 수는 설정에서 오지만, Celery CLI 에도 명시해 둔다.
      - --concurrency=${STT_MAX_CONCURRENT_JOBS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # 선택 서비스. LLM 을 컨테이너로 함께 띄운다.
  #     docker compose --profile llm up -d ollama
  # 호스트에 이미 Ollama 가 있고 외부 접속을 허용했다면 이 서비스는 필요 없다.
  # 그 경우 LLM_BASE_URL 만 그 주소로 지정한다.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      - ollama:/root/.ollama
    # 컨테이너 안에서만 접근한다. 호스트로 열지 않는다.
    expose:
      - "11434"
    restart: unless-stopped

volumes:
  pgdata:
  # 프로필로 띄웠을 때만 쓰인다. 모델 가중치가 수 GB 이므로 별도 볼륨에 둔다.
  ollama:
  # 음성과 Transcript 는 Confidential 이다 (Harness §8.1). 호스트 바인드 대신
  # 이름 있는 볼륨을 쓴다 — 실수로 저장소에 커밋될 여지를 없앤다.
  sttdata:
